[package]
name = "devpod"
version = "0.1.0"
edition = "2021"
description = "Edge development environment orchestrator for offline-capable Kubernetes clusters"
authors = ["Your Team"]
license = "MIT"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full", "process"] }

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging and output
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2"
indicatif = "0.17"  # Progress bars

# Git operations
git2 = "0.19"

# Container/Docker operations
bollard = "0.18"

# HTTP client (for registry operations)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Archive operations
tar = "0.4"
flate2 = "1"

# File system utilities
walkdir = "2"
tempfile = "3"
dirs = "5"

# Process execution
duct = "0.13"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# SHA256 for image digests
sha2 = "0.10"
hex = "0.4"
nix = { version = "0.31.1", features = ["signal"] }
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3"
